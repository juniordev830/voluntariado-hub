name: Java domain checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: mkdir -p out && javac -Xlint:all -Werror -d out src/VolunteerHub.java test/VolunteerHubTest.java
      - run: java -cp out VolunteerHubTest
      - run: java -cp out VolunteerHub
