name: Java domain checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - run: mkdir -p out && javac -Xlint:all -Werror -d out src/VolunteerHub.java test/VolunteerHubTest.java
      - run: java -cp out VolunteerHubTest
      - run: java -cp out VolunteerHub
